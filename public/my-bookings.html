
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings | LocalTrails</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .bookings-container {
            max-width: 1100px;
            margin: auto 60px;
            padding: 20px;
        }

        .bookings-container h1 {
            color: #245849;
            margin-bottom: 10px;
        }

        .booking-subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .booking-card {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .booking-card h3 {
            color: #245849;
            margin-bottom: 12px;
        }

        .booking-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin: 18px 0;
        }

        .detail-label {
            color: #888;
            font-size: 13px;
        }

        .detail-value {
            font-weight: 600;
            margin-top: 4px;
        }

        .booking-status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: capitalize;
            background: #eee;
        }

        .status-confirmed {
            background: #d9f5e3;
            color: #16713b;
        }

        .status-pending {
            background: #fff1cc;
            color: #956500;
        }

        .status-cancelled {
            background: #ffe0e0;
            color: #b42323;
        }

        .status-completed {
            background: #dce8ff;
            color: #2454a6;
        }

        .cancel-btn {
            background: #b42323;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }

        .cancel-btn:hover {
            background: #8e1919;
        }

        .empty-bookings {
            text-align: center;
            padding: 50px 20px;
            background: white;
            border-radius: 14px;
        }

        .empty-bookings a {
            color: #245849;
            font-weight: bold;
        }
        /* Review form styling */
.review-form {
    margin-top: 25px;
}

.review-form h4 {
    color: #245849;
    margin-bottom: 16px;
    font-size: 20px;
}

.review-form select,
.review-form textarea {
    padding: 12px 14px;
    border: 1px solid #d7e3da;
    border-radius: 10px;
    background: #f8fbf8;
    color: #245849;
    font-family: inherit;
    font-size: 15px;
    outline: none;
    transition: 0.2s ease;
}

.review-form select {
    min-width: 250px;
    cursor: pointer;
}

.review-form textarea {
    display: block;
    width: 100%;
    max-width: 500px;
    min-height: 85px;
    margin-top: 12px;
    resize: vertical;
}

.review-form select:focus,
.review-form textarea:focus {
    border-color: #245849;
    box-shadow: 0 0 0 3px rgba(36, 88, 73, 0.1);
}

.review-form button {
    margin-top: 14px;
    padding: 12px 26px;
    border: none;
    border-radius: 25px;
    background: #245849;
    color: white;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s ease;
}

.review-form button:hover {
    background: #d98b45;
    transform: translateY(-2px);
}

.review-form button:active {
    transform: scale(0.98);
}

        @media(max-width: 600px) {
            .booking-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header class="navbar">
        <a href="index.html" class="logo-wrap"
           style="text-decoration:none;">
            <span class="logo">Local<span>Trails.</span></span>
        </a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#packages">Packages</a>
            <a href="my-bookings.html">My Bookings</a>
        </nav>
    </header>

    <main class="bookings-container">

        <h1>My Bookings</h1>
        <p class="booking-subtitle">
            View and manage your travel reservations.
        </p>

        <div id="bookings-list">
            <p>Loading your bookings...</p>
        </div>

    </main>

    <script>
        const bookingsList = document.getElementById("bookings-list");

        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[char]);
        }

        function formatDate(date) {
            if (!date) return "Not available";

            const d = new Date(date);

            if (isNaN(d.getTime())) return escapeHTML(date);

            return d.toLocaleDateString("en-IN", {
                day: "numeric",
                month: "long",
                year: "numeric"
            });
        }
        async function submitReview(bookingId) {
    const rating = Number(
        document.getElementById(`rating-${bookingId}`).value
    );

    const comment = document.getElementById(`comment-${bookingId}`).value.trim();

    if (!rating || rating < 1 || rating > 5) {
        alert("Please select a rating.");
        return;
    }

    try {
        const response = await fetch("/api/reviews", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "include",
            body: JSON.stringify({
                booking_id: bookingId,
                rating: rating,
                comment: comment
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || "Unable to submit review.");
        }

        alert("Review submitted successfully!");
        loadBookings();

    } catch (error) {
        alert(error.message);
    }
}

        async function loadBookings() {
            try {
                const response = await fetch("/api/bookings/my-bookings", {
                    credentials: "include"
                });

                const data = await response.json();

                if (response.status === 401) {
                    alert("Please login to view your bookings.");
                    window.location.href = "login.html";
                    return;
                }

                if (!response.ok) {
                    throw new Error(data.message || "Unable to load bookings.");
                }

                const bookings = Array.isArray(data)
                    ? data
                    : (data.bookings || []);

                if (bookings.length === 0) {
                    bookingsList.innerHTML = `
                        <div class="empty-bookings">
                            <h2>No bookings yet!</h2>
                            <p>You haven't booked any trips.</p>
                            <a href="index.html#packages">
                                Explore Packages
                            </a>
                        </div>
                    `;
                    return;
                }

                bookingsList.innerHTML = bookings.map(booking => {
                    const status = String(booking.booking_status || "pending")
                        .toLowerCase();

                    const canCancel =
                        status === "pending" || status === "confirmed";

                    return `
                        <div class="booking-card">

                            <h3>
                                ${escapeHTML(booking.package_title || booking.title || "Tour Package")}
                            </h3>

                            <p>
                                📍 ${escapeHTML(booking.destination || "Destination")}
                            </p>

                            <div class="booking-details">

                                <div>
                                    <div class="detail-label">Booking ID</div>
                                    <div class="detail-value">
                                        #${escapeHTML(booking.booking_id)}
                                    </div>
                                </div>

                                <div>
                                    <div class="detail-label">Travel Date</div>
                                    <div class="detail-value">
                                        ${formatDate(booking.available_date || booking.travel_date)}
                                    </div>
                                </div>

                                <div>
                                    <div class="detail-label">Number of People</div>
                                    <div class="detail-value">
                                        ${escapeHTML(booking.number_of_people)}
                                    </div>
                                </div>

                                <div>
                                    <div class="detail-label">Total Amount</div>
                                    <div class="detail-value">
                                        ₹${Number(booking.total_amount || 0).toLocaleString("en-IN")}
                                    </div>
                                </div>

                                <div>
                                    <div class="detail-label">Booking Status</div>
                                    <div class="detail-value">
                                        <span class="booking-status status-${escapeHTML(status)}">
                                            ${escapeHTML(status)}
                                        </span>
                                    </div>
                                </div>

                                <div>
                                    <div class="detail-label">Payment Status</div>
                                    <div class="detail-value">
                                        ${escapeHTML(booking.payment_status || "Not paid")}
                                    </div>
                                </div>

                            </div>

                            ${
                                canCancel
                                ? `<button class="cancel-btn"
                                    onclick="cancelBooking(${Number(booking.booking_id)})">
                                    Cancel Booking
                                   </button>`
                                : ""
                            }
                                ${
    status === "completed"
    ? `
        <div class="review-form">
            <h4>Rate Your Experience</h4>

            <select id="rating-${booking.booking_id}">
                <option value="">Select rating</option>
                <option value="5">⭐⭐⭐⭐⭐ Excellent</option>
                <option value="4">⭐⭐⭐⭐ Very Good</option>
                <option value="3">⭐⭐⭐ Good</option>
                <option value="2">⭐⭐ Fair</option>
                <option value="1">⭐ Poor</option>
            </select>

            <textarea
                id="comment-${booking.booking_id}"
                placeholder="Write your experience..."
                maxlength="1000">
            </textarea>

            <button onclick="submitReview(${Number(booking.booking_id)})">
                Submit Review
            </button>
        </div>
    `
    : ""
}

                        </div>
                    `;
                }).join("");
                

            } catch (error) {
                console.error("Booking history error:", error);

                bookingsList.innerHTML = `
                    <p>Unable to load bookings. Please refresh the page.</p>
                `;
            }
        }

        async function cancelBooking(bookingId) {
            const confirmed = confirm(
                "Are you sure you want to cancel this booking?"
            );

            if (!confirmed) return;

            try {
                const response = await fetch(`/api/bookings/${bookingId}`, {
                    method: "DELETE",
                    credentials: "include"
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Cancellation failed.");
                }

                alert(data.message || "Booking cancelled successfully!");

                loadBookings();

            } catch (error) {
                console.error("Cancellation error:", error);
                alert(error.message || "Unable to cancel booking.");
            }
        }

        loadBookings();
    </script>

</body>
</html>
