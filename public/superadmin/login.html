<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>LocalTrails | Super Admin sign in</title>
  <link rel="stylesheet" href="/css/staff-login.css">
</head>
<body data-role="super_admin">
  <main class="auth-layout">
    <section class="hero" aria-label="LocalTrails portal">
      <a class="logo" href="/">
        <span class="logo-mark">L</span>
        <span>LocalTrails</span>
      </a>
      <div class="hero-copy">
        <span class="eyebrow">SUPER ADMIN PORTAL</span>
        <h1>Focused access for platform oversight.</h1>
        <p>Manage administrators, review operations, and oversee the platform securely.</p>
      </div>
      <div class="hero-note">Secure internal access</div>
    </section>

    <section class="auth-side">
      <div class="auth-top"><a href="/">← Back to website</a></div>

      <div class="auth-card">
        <div class="auth-symbol" aria-hidden="true">✦</div>
        <h2>Super Admin sign in</h2>
        <form id="staffLogin" novalidate>
          <label for="email">Email address</label>
          <input id="email" type="email" name="email" autocomplete="username" placeholder="superadmin@localtrails.com" required>

          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" type="password" name="password" autocomplete="current-password" placeholder="Enter your password" required>
            <button id="showPassword" type="button" aria-label="Show password">Show</button>
          </div>

          <p id="loginFeedback" class="feedback" role="alert" aria-live="polite"></p>
          <button class="submit" id="submitLogin" type="submit">Sign in <span aria-hidden="true">→</span></button>
        </form>
      </div>

      <div class="auth-bottom"><a href="/admin/login.html">Admin login</a></div>
    </section>
  </main>
  <script src="/js/staff-login.js" defer></script>
</body>
</html>
