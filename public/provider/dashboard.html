<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Provider Dashboard | Local Trails</title>
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
  <div id="app-shell" data-role="provider" data-title="Provider Dashboard"></div>

  <template id="page-content">
    <section aria-label="Quick actions" class="card" style="margin-bottom:24px">
      <div class="card__header"><h2>Quick Actions</h2></div>
      <div class="actions">
        <a class="btn" href="add-package.html">➕ Add New Package</a>
        <a class="btn btn--outline" href="packages.html">🧳 Manage Packages</a>
        <a class="btn btn--outline" href="bookings.html">🎫 View Bookings</a>
      </div>
    </section>

    <section aria-label="Statistics"><div id="statsGrid"></div></section>

    <section class="card" aria-label="Recent bookings">
      <div class="card__header">
        <h2>Recent Bookings</h2>
        <a href="bookings.html">View all →</a>
      </div>
      <div id="recentBookings"></div>
    </section>
  </template>

  <script src="../js/dashboard-common.js"></script>
  <script src="../js/provider.js"></script>
</body>
</html>
